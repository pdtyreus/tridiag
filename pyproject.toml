[project]
name = "tridiag"
version = "0.2.1"
description = "High performance, differentiable solvers for tridiagonal systems"
authors = [
    {name = "P. Daniel Tyreus"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy>=2.0.0,<3.0.0",
    "numba>=0.60.0"
]

[project.urls]
Homepage = "https://github.com/pdtyreus/tridiag"
Issues = "https://github.com/pdtyreus/tridiag/issues"
Benchmarks = "https://pdtyreus.github.io/numerical_methods/tridiagonal_solvers.html"

[project.optional-dependencies]
gpu = [
    "mlx>=0.18.0"
]

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.0"
pytest = "^9.0.2"
matplotlib = "^3.10.8"
scipy = "^1.14.0"
tqdm = "^4.70.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (F) and E4/E7/E9 (Error) codes by default.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "D"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["tridiag"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
